{% extends 'base.html' %}

{% block title %}Redefinir Contraseña - FaCyT{% endblock %}

{% block content %}
<main style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 20px;">
    <article style="max-width: 450px; width: 100%; padding: 32px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);">
        
        <header style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">🔒</div>
            <h3 style="margin-bottom: 8px; font-weight: 800; color: #0f172a; font-size: 1.35rem;">Nueva Contraseña</h3>
            <p style="color: #64748b; font-size: 0.9rem; margin: 0; font-weight: 500;">Crea una clave segura para restablecer tu cuenta</p>
        </header>
        
        <!-- Formulario apunta a /redefinir-clave sin token -->
        <form action="{{ url_for('redefinir_password') }}" method="POST">
            <div style="margin-bottom: 20px;">
                <label for="password" style="display: block; font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 6px; text-transform: uppercase;">
                    Nueva Contraseña:
                </label>
                <input type="password" id="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer;">
                Cambiar Contraseña
            </button>
        </form>

    </article>
</main>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Redefinir Contraseña - FaCyT{% endblock %}

{% block content %}
<article style="max-width: 480px; margin: 20px auto; padding: 30px;">
    <header style="text-align: center; margin-bottom: 20px;">
        <h3 style="margin-bottom: 5px;">Nueva Contraseña 🔒</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Crea una clave segura para restablecer tu cuenta</p>
    </header>
    
    <form action="/recuperar-acceso/redefinir/{{ token }}" method="POST">
        <div style="margin-bottom: 20px;">
            <label for="password">Nueva Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <input type="submit" value="Cambiar Contraseña" class="primary" style="width: 100%;">
    </form>
</article>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Registro Institucional - FaCyT{% endblock %}

{% block content %}
<main style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 30px 20px;">
    <article style="max-width: 480px; width: 100%; padding: 32px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);">
        
        <!-- Encabezado -->
        <header style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">🎓</div>
            <h3 style="margin-bottom: 8px; font-weight: 800; color: #0f172a; font-size: 1.35rem;">Registro Único FaCyT</h3>
            <p style="color: #64748b; font-size: 0.88rem; margin: 0; font-weight: 500; line-height: 1.4;">
                Las cuentas académicas de personal serán validadas dinámicamente con la base de datos institucional.
            </p>
        </header>
        
        <!-- Formulario -->
        <form action="{{ url_for('registro') }}" method="POST">
            <div style="margin-bottom: 16px;">
                <label for="nombre" style="display: block; font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 6px; text-transform: uppercase;">
                    Nombre Completo:
                </label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Pérez" required style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;">
            </div>

            <div style="margin-bottom: 16px;">
                <label for="cedula" style="display: block; font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 6px; text-transform: uppercase;">
                    Cédula de Identidad:
                </label>
                <input type="text" id="cedula" name="cedula" placeholder="Ej. V-12345678" required style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;">
            </div>

            <div style="margin-bottom: 16px;">
                <label for="correo" style="display: block; font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 6px; text-transform: uppercase;">
                    Correo Electrónico:
                </label>
                <input type="email" id="correo" name="correo" placeholder="usuario@uc.edu.ve" required style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;">
            </div>

            <div style="margin-bottom: 16px;">
                <label for="contrasena" style="display: block; font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 6px; text-transform: uppercase;">
                    Contraseña:
                </label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;">
            </div>

            <div style="margin-bottom: 24px;">
                <label for="rol" style="display: block; font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 6px; text-transform: uppercase;">
                    Tipo de Usuario (Rol):
                </label>
                <select id="rol" name="rol" required style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; background-color: #ffffff; color: #334155; cursor: pointer;">
                    <option value="estudiante">Estudiante </option>
                    <option value="profesor"> Profesor/ponente> </option>
                    <option value="administrativo">Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border-radius: 6px;">
                Crear Cuenta
            </button>
        </form>
        
        <hr style="margin: 24px 0; border: 0; border-top: 1px solid #e2e8f0;">

        <!-- Pie de tarjeta -->
        <footer style="text-align: center; font-size: 0.88rem; background: transparent; border-top: none; padding: 0; color: #475569;">
            ¿Ya tienes una cuenta? 
            <a href="{{ url_for('login') }}" style="color: #1d4ed8; font-weight: 700; text-decoration: none;">
                Inicia sesión aquí
            </a>
        </footer>
    </article>
</main>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Registro Institucional - FaCyT{% endblock %}

{% block content %}
<article style="max-width: 520px; margin: 20px auto; padding: 30px;">
    <header style="text-align: center; margin-bottom: 20px;">
        <h2 style="margin-bottom: 5px;">Registro Único FaCyT 🎓</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Las cuentas académicas de personal serán validadas dinámicamente con la base de datos institucional.</p>
    </header>

    <form action="/registro" method="POST">
        <div style="margin-bottom: 12px;">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Pérez" required>
        </div>

        <div style="margin-bottom: 12px;">
            <label for="cedula">Cédula de Identidad:</label>
            <input type="text" id="cedula" name="cedula" placeholder="Ej. V-12345678" required>
        </div>

        <div style="margin-bottom: 12px;">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="usuario@uc.edu.ve" required>
        </div>

        <div style="margin-bottom: 12px;">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="rol">Tipo de Usuario (Rol):</label>
            <select id="rol" name="rol" required>
                <option value="estudiante">Estudiante / Usuario General</option>
                <option value="ponente">Ponente / Profesor Responsable</option>
                <option value="administrativo">Personal Administrativo</option>
            </select>
        </div>

        <button type="submit" class="primary" style="width: 100%;">Crear Cuenta</button>

        <p style="text-align: center; margin-top: 15px; margin-bottom: 0; font-size: 0.9rem;">
            ¿Ya tienes una cuenta? <a href="/login" style="color: var(--primary); font-weight: 600;">Inicia sesión aquí</a>
        </p>
    </form>
</article>
{% endblock %}

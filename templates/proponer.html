{% extends 'base.html' %}

{% block title %}Proponer Evento - FaCyT{% endblock %}

{% block content %}
<article style="max-width: 650px; margin: 0 auto;">
    <h2>Proponer Iniciativa o Evento 💡</h2>
    <p style="color: var(--text-muted);">Envía tu propuesta de actividad académica, taller o charla para ser evaluada por la coordinación.</p>

    <form action="{{ url_for('proponer') }}" method="POST">
        <div style="margin-bottom: 15px;">
            <label for="titulo">Título de la Idea / Propuesta:</label>
            <input type="text" id="titulo" name="titulo" required placeholder="Ej. Taller de Introducción a Python">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="tipo_actividad">Tipo de Actividad:</label>
            <select id="tipo_actividad" name="tipo_actividad" required>
                <option value="" disabled selected>Seleccione una opción</option>
                <option value="Conferencia">Conferencia</option>
                <option value="Taller">Taller / Workshop</option>
                <option value="Seminario">Seminario</option>
                <option value="Charla Informativa">Charla Informativa</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label for="descripcion">Descripción / Justificación Técnica:</label>
            <textarea id="descripcion" name="descripcion" rows="5" required placeholder="Explica de qué trata la actividad y a quién va dirigida..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <a href="{{ url_for('inicio') }}" class="button secondary outline" style="margin: 0;">Cancelar</a>
            <button type="submit" class="primary" style="margin: 0;">Enviar Propuesta</button>
        </div>
    </form>
</article>
{% endblock %}
